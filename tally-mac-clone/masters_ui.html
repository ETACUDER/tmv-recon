<!-- MASTERS MANAGEMENT UI COMPONENTS -->
<!-- Add this Masters button to the workspace tabs section -->
<button
    @click="workspaceMode = 'masters'"
    :class="workspaceMode === 'masters' ? 'bg-blue-50 text-blue-700 border-blue-300' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'"
    class="px-4 py-2 rounded-lg border font-medium text-sm transition-colors">
    Masters (Alt+K)
</button>

<!-- Add these views to the Workspace Content section -->

<!-- MASTERS MENU VIEW -->
<div x-show="workspaceMode === 'masters' && !mastersSubMode" class="space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">Masters</h2>
        <p class="text-gray-600 mt-1">Manage ledgers, groups, and other master data</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <button @click="mastersSubMode = 'ledgers'" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
            <h3 class="text-lg font-semibold text-gray-900">Ledgers</h3>
            <p class="text-sm text-gray-600 mt-1">Manage account ledgers</p>
        </button>

        <button @click="mastersSubMode = 'groups'" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
            <h3 class="text-lg font-semibold text-gray-900">Groups</h3>
            <p class="text-sm text-gray-600 mt-1">Account group hierarchy</p>
        </button>

        <button @click="mastersSubMode = 'cost-centers'" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
            <h3 class="text-lg font-semibold text-gray-900">Cost Centers</h3>
            <p class="text-sm text-gray-600 mt-1">Department/project tracking</p>
        </button>

        <button @click="mastersSubMode = 'currencies'" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
            <h3 class="text-lg font-semibold text-gray-900">Currencies</h3>
            <p class="text-sm text-gray-600 mt-1">Multi-currency management</p>
        </button>

        <button @click="mastersSubMode = 'stock-items'" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
            <h3 class="text-lg font-semibold text-gray-900">Stock Items</h3>
            <p class="text-sm text-gray-600 mt-1">Inventory items</p>
        </button>
    </div>
</div>

<!-- LEDGERS LIST VIEW -->
<div x-show="mastersSubMode === 'ledgers' && !editingLedger" class="space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Ledgers</h2>
            <p class="text-gray-600 mt-1">Manage account ledgers</p>
        </div>
        <div class="flex gap-2">
            <button @click="createNewLedger()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                Create (Alt+C)
            </button>
            <button @click="mastersSubMode = null" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                Back (Esc)
            </button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <input
            type="text"
            x-model="ledgerSearch"
            placeholder="Search ledgers..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Group</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Opening Balance</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="ledger in filteredLedgers" :key="ledger.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-medium text-gray-900" x-text="ledger.name"></td>
                        <td class="px-6 py-4 text-sm text-gray-600" x-text="ledger.group"></td>
                        <td class="px-6 py-4 text-sm text-right text-gray-900" x-text="formatCurrency(ledger.opening_balance)"></td>
                        <td class="px-6 py-4 text-sm text-right space-x-2">
                            <button @click="editLedger(ledger)" class="text-blue-600 hover:text-blue-800">Edit</button>
                            <button @click="deleteLedger(ledger)" class="text-red-600 hover:text-red-800">Delete</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>

<!-- LEDGER FORM (Create/Edit) -->
<div x-show="editingLedger" class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-900" x-text="ledgerForm.id ? 'Edit Ledger' : 'Create Ledger'"></h2>
        <button @click="cancelLedgerForm()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
            Cancel (Esc)
        </button>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input
                type="text"
                x-model="ledgerForm.name"
                @keydown.enter="saveLedger()"
                @keydown.escape="cancelLedgerForm()"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter ledger name"
            />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Group</label>
            <select
                x-model="ledgerForm.group_name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
                <option value="">Select a group</option>
                <template x-for="group in groups" :key="group.id">
                    <option :value="group.name" x-text="group.name"></option>
                </template>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Opening Balance</label>
            <input
                type="number"
                step="0.01"
                x-model="ledgerForm.opening_balance"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="0.00"
            />
        </div>

        <div class="flex gap-2 pt-4">
            <button
                @click="saveLedger()"
                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                Save (Enter)
            </button>
            <button
                @click="cancelLedgerForm()"
                class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                Cancel (Esc)
            </button>
        </div>
    </div>
</div>

<!-- GROUPS LIST/TREE VIEW -->
<div x-show="mastersSubMode === 'groups' && !editingGroup" class="space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Groups</h2>
            <p class="text-gray-600 mt-1">Account group hierarchy</p>
        </div>
        <div class="flex gap-2">
            <button @click="createNewGroup()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                Create (Alt+C)
            </button>
            <button @click="mastersSubMode = null" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                Back (Esc)
            </button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <div class="space-y-2">
            <template x-for="group in rootGroups" :key="group.id">
                <div class="border-l-2 border-gray-200 pl-4">
                    <div class="flex items-center justify-between py-2 hover:bg-gray-50 rounded px-2">
                        <span class="font-medium text-gray-900" x-text="group.name"></span>
                        <div class="space-x-2">
                            <button @click="editGroup(group)" class="text-blue-600 hover:text-blue-800 text-sm">Edit</button>
                            <button @click="deleteGroup(group)" class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                        </div>
                    </div>
                    <template x-for="child in getChildGroups(group.id)" :key="child.id">
                        <div class="ml-6 border-l-2 border-gray-200 pl-4">
                            <div class="flex items-center justify-between py-2 hover:bg-gray-50 rounded px-2">
                                <span class="text-gray-700" x-text="child.name"></span>
                                <div class="space-x-2">
                                    <button @click="editGroup(child)" class="text-blue-600 hover:text-blue-800 text-sm">Edit</button>
                                    <button @click="deleteGroup(child)" class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>
