<!-- Ledger Table Component -->
<div x-data="ledgerTable()" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Ledger Masters</h2>
            <p class="text-gray-600 mt-1">Manage all ledger accounts</p>
        </div>
        <button
            @click="createLedger"
            class="px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors flex items-center gap-2"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Create Ledger
        </button>
    </div>

    <!-- Data Table -->
    <div x-data="dataTable(tableConfig)" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- Table Header -->
        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between gap-4">
            <div class="flex-1 flex items-center gap-4">
                <!-- Search by Name -->
                <div class="flex-1 max-w-md">
                    <div class="relative">
                        <input
                            type="text"
                            x-model="searchQuery"
                            @input="handleSearch"
                            placeholder="Search ledger by name..."
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                        />
                        <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <!-- Filter by Group -->
                <select
                    x-model="activeFilters.group"
                    @change="applyFilters"
                    class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                >
                    <option value="">All Groups</option>
                    <option value="Sundry Debtors">Sundry Debtors</option>
                    <option value="Sundry Creditors">Sundry Creditors</option>
                    <option value="Bank Accounts">Bank Accounts</option>
                    <option value="Cash-in-Hand">Cash-in-Hand</option>
                    <option value="Sales Accounts">Sales Accounts</option>
                    <option value="Purchase Accounts">Purchase Accounts</option>
                    <option value="Direct Expenses">Direct Expenses</option>
                    <option value="Indirect Expenses">Indirect Expenses</option>
                </select>

                <!-- Filter by Type -->
                <select
                    x-model="activeFilters.type"
                    @change="applyFilters"
                    class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                >
                    <option value="">All Types</option>
                    <option value="Asset">Asset</option>
                    <option value="Liability">Liability</option>
                    <option value="Revenue">Revenue</option>
                    <option value="Expense">Expense</option>
                </select>
            </div>

            <!-- Export Button -->
            <button
                @click="exportToExcel"
                class="px-3 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium flex items-center gap-2"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Export Excel
            </button>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th @click="sortBy('name')" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center gap-2">
                                <span>Name</span>
                                <svg x-show="sortColumn === 'name'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th @click="sortBy('group')" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center gap-2">
                                <span>Group</span>
                                <svg x-show="sortColumn === 'group'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th @click="sortBy('type')" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center gap-2">
                                <span>Type</span>
                                <svg x-show="sortColumn === 'type'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th @click="sortBy('opening_balance')" class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center justify-end gap-2">
                                <span>Opening Balance</span>
                                <svg x-show="sortColumn === 'opening_balance'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th @click="sortBy('current_balance')" class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center justify-end gap-2">
                                <span>Current Balance</span>
                                <svg x-show="sortColumn === 'current_balance'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <template x-for="(ledger, index) in paginatedData" :key="ledger.id">
                        <tr
                            @click="editLedger(ledger)"
                            @keydown.enter="editLedger(ledger)"
                            @keydown.arrow-down="focusNextRow($event, index)"
                            @keydown.arrow-up="focusPrevRow($event, index)"
                            tabindex="0"
                            class="hover:bg-blue-50 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset"
                        >
                            <td class="px-6 py-4 text-sm font-medium text-gray-900" x-text="ledger.name"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" x-text="ledger.group"></td>
                            <td class="px-6 py-4 text-sm">
                                <span
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full"
                                    :class="{
                                        'bg-green-100 text-green-800': ledger.type === 'Asset',
                                        'bg-red-100 text-red-800': ledger.type === 'Liability',
                                        'bg-blue-100 text-blue-800': ledger.type === 'Revenue',
                                        'bg-yellow-100 text-yellow-800': ledger.type === 'Expense'
                                    }"
                                    x-text="ledger.type"
                                ></span>
                            </td>
                            <td class="px-6 py-4 text-sm text-right text-gray-900" x-text="formatCurrency(ledger.opening_balance)"></td>
                            <td class="px-6 py-4 text-sm text-right font-semibold"
                                :class="ledger.current_balance >= 0 ? 'text-green-600' : 'text-red-600'"
                                x-text="formatCurrency(ledger.current_balance)">
                            </td>
                        </tr>
                    </template>

                    <!-- Empty State -->
                    <tr x-show="filteredData.length === 0">
                        <td colspan="5" class="px-6 py-12 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                            <p class="mt-4 text-sm text-gray-600">No ledgers found</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div x-show="filteredData.length > 10" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                Showing <span x-text="((currentPage - 1) * 10) + 1"></span> to
                <span x-text="Math.min(currentPage * 10, filteredData.length)"></span> of
                <span x-text="filteredData.length"></span> ledgers
            </div>
            <div class="flex gap-2">
                <button
                    @click="currentPage--"
                    :disabled="currentPage === 1"
                    class="px-3 py-1 border border-gray-300 rounded-lg text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50"
                >
                    Previous
                </button>
                <button
                    @click="currentPage++"
                    :disabled="currentPage === totalPages"
                    class="px-3 py-1 border border-gray-300 rounded-lg text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50"
                >
                    Next
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function ledgerTable() {
    return {
        // Sample data - replace with API calls
        ledgers: [
            { id: 1, name: 'Cash Account', group: 'Cash-in-Hand', type: 'Asset', opening_balance: 50000, current_balance: 84500 },
            { id: 2, name: 'HDFC Bank', group: 'Bank Accounts', type: 'Asset', opening_balance: 100000, current_balance: 125000 },
            { id: 3, name: 'ABC Suppliers', group: 'Sundry Creditors', type: 'Liability', opening_balance: 0, current_balance: -25000 },
            { id: 4, name: 'XYZ Customer', group: 'Sundry Debtors', type: 'Asset', opening_balance: 0, current_balance: 45000 },
            { id: 5, name: 'Sales Account', group: 'Sales Accounts', type: 'Revenue', opening_balance: 0, current_balance: 250000 },
            { id: 6, name: 'Rent Expense', group: 'Indirect Expenses', type: 'Expense', opening_balance: 0, current_balance: 30000 },
            { id: 7, name: 'Salary Expense', group: 'Direct Expenses', type: 'Expense', opening_balance: 0, current_balance: 75000 },
            { id: 8, name: 'Purchase Account', group: 'Purchase Accounts', type: 'Expense', opening_balance: 0, current_balance: 150000 },
        ],

        searchQuery: '',
        sortColumn: 'name',
        sortDirection: 'asc',
        activeFilters: { group: '', type: '' },
        currentPage: 1,

        get tableConfig() {
            return {
                data: this.ledgers,
                rowKey: 'id'
            };
        },

        get filteredData() {
            let data = this.ledgers;

            // Search
            if (this.searchQuery) {
                const query = this.searchQuery.toLowerCase();
                data = data.filter(ledger =>
                    ledger.name.toLowerCase().includes(query)
                );
            }

            // Filters
            if (this.activeFilters.group) {
                data = data.filter(ledger => ledger.group === this.activeFilters.group);
            }
            if (this.activeFilters.type) {
                data = data.filter(ledger => ledger.type === this.activeFilters.type);
            }

            // Sort
            if (this.sortColumn) {
                data = [...data].sort((a, b) => {
                    const aVal = a[this.sortColumn];
                    const bVal = b[this.sortColumn];
                    const comparison = typeof aVal === 'number'
                        ? aVal - bVal
                        : String(aVal).localeCompare(String(bVal));
                    return this.sortDirection === 'asc' ? comparison : -comparison;
                });
            }

            return data;
        },

        get paginatedData() {
            const start = (this.currentPage - 1) * 10;
            return this.filteredData.slice(start, start + 10);
        },

        get totalPages() {
            return Math.ceil(this.filteredData.length / 10);
        },

        handleSearch() {
            this.currentPage = 1;
        },

        applyFilters() {
            this.currentPage = 1;
        },

        sortBy(column) {
            if (this.sortColumn === column) {
                this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                this.sortColumn = column;
                this.sortDirection = 'asc';
            }
        },

        formatCurrency(value) {
            return '₹' + Math.abs(value).toLocaleString('en-IN', { minimumFractionDigits: 2 });
        },

        editLedger(ledger) {
            alert('Edit Ledger: ' + ledger.name);
            // Implement edit modal/form
        },

        createLedger() {
            alert('Create New Ledger');
            // Implement create modal/form
        },

        focusNextRow(event, index) {
            event.preventDefault();
            const rows = event.target.closest('tbody').querySelectorAll('tr');
            if (rows[index + 1]) rows[index + 1].focus();
        },

        focusPrevRow(event, index) {
            event.preventDefault();
            const rows = event.target.closest('tbody').querySelectorAll('tr');
            if (rows[index - 1]) rows[index - 1].focus();
        },

        exportToExcel() {
            const headers = 'Name,Group,Type,Opening Balance,Current Balance';
            const rows = this.filteredData.map(l =>
                `"${l.name}","${l.group}","${l.type}",${l.opening_balance},${l.current_balance}`
            ).join('\n');
            const csv = headers + '\n' + rows;
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ledgers.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    };
}
</script>
