<!-- Voucher List Table Component -->
<div x-data="voucherListTable()" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Vouchers</h2>
            <p class="text-gray-600 mt-1">View and manage all vouchers</p>
        </div>
        <button
            @click="createVoucher"
            class="px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors flex items-center gap-2"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Create Voucher
        </button>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- Table Header with Filters -->
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex items-center gap-4 flex-wrap">
                <!-- Search -->
                <div class="flex-1 min-w-[250px]">
                    <div class="relative">
                        <input
                            type="text"
                            x-model="searchQuery"
                            @input="handleSearch"
                            placeholder="Search by number, party, narration..."
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                        />
                        <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <!-- Date Range Filter -->
                <div class="flex items-center gap-2">
                    <input
                        type="date"
                        x-model="dateRange.from"
                        @change="applyFilters"
                        class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    />
                    <span class="text-gray-500">to</span>
                    <input
                        type="date"
                        x-model="dateRange.to"
                        @change="applyFilters"
                        class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    />
                </div>

                <!-- Voucher Type Filter -->
                <select
                    x-model="activeFilters.type"
                    @change="applyFilters"
                    class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                >
                    <option value="">All Types</option>
                    <option value="Payment">Payment</option>
                    <option value="Receipt">Receipt</option>
                    <option value="Journal">Journal</option>
                    <option value="Contra">Contra</option>
                    <option value="Sales">Sales</option>
                    <option value="Purchase">Purchase</option>
                    <option value="Credit Note">Credit Note</option>
                    <option value="Debit Note">Debit Note</option>
                </select>

                <!-- Party Filter -->
                <select
                    x-model="activeFilters.party"
                    @change="applyFilters"
                    class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                >
                    <option value="">All Parties</option>
                    <template x-for="party in uniqueParties" :key="party">
                        <option :value="party" x-text="party"></option>
                    </template>
                </select>

                <!-- Batch Delete -->
                <button
                    x-show="selectedVouchers.length > 0"
                    @click="batchDelete"
                    class="px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium flex items-center gap-2"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    Delete (<span x-text="selectedVouchers.length"></span>)
                </button>

                <!-- Export -->
                <button
                    @click="exportToExcel"
                    class="px-3 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium flex items-center gap-2"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Export
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <!-- Select All -->
                        <th class="px-4 py-3 w-12">
                            <input
                                type="checkbox"
                                @change="toggleSelectAll"
                                :checked="selectedVouchers.length === filteredData.length && filteredData.length > 0"
                                class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                            />
                        </th>
                        <th @click="sortBy('date')" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center gap-2">
                                <span>Date</span>
                                <svg x-show="sortColumn === 'date'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th @click="sortBy('type')" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center gap-2">
                                <span>Type</span>
                                <svg x-show="sortColumn === 'type'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Number</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Party</th>
                        <th @click="sortBy('amount')" class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-100">
                            <div class="flex items-center justify-end gap-2">
                                <span>Amount</span>
                                <svg x-show="sortColumn === 'amount'" class="w-4 h-4" :class="sortDirection === 'asc' ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Narration</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <template x-for="(voucher, index) in paginatedData" :key="voucher.id">
                        <tr
                            @click="viewVoucher(voucher)"
                            @keydown.enter="viewVoucher(voucher)"
                            @keydown.arrow-down="focusNextRow($event, index)"
                            @keydown.arrow-up="focusPrevRow($event, index)"
                            tabindex="0"
                            class="hover:bg-blue-50 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset"
                        >
                            <td class="px-4 py-4" @click.stop>
                                <input
                                    type="checkbox"
                                    :checked="selectedVouchers.includes(voucher.id)"
                                    @change="toggleSelection(voucher.id)"
                                    class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                />
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900" x-text="formatDate(voucher.date)"></td>
                            <td class="px-6 py-4 text-sm">
                                <span
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full"
                                    :class="getTypeColor(voucher.type)"
                                    x-text="voucher.type"
                                ></span>
                            </td>
                            <td class="px-6 py-4 text-sm font-medium text-gray-900" x-text="voucher.number"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" x-text="voucher.party"></td>
                            <td class="px-6 py-4 text-sm text-right font-semibold text-gray-900" x-text="formatCurrency(voucher.amount)"></td>
                            <td class="px-6 py-4 text-sm text-gray-600">
                                <span class="line-clamp-1" x-text="voucher.narration"></span>
                            </td>
                        </tr>
                    </template>

                    <!-- Empty State -->
                    <tr x-show="filteredData.length === 0">
                        <td colspan="7" class="px-6 py-12 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <p class="mt-4 text-sm text-gray-600">No vouchers found</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div x-show="filteredData.length > 15" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                Showing <span x-text="((currentPage - 1) * 15) + 1"></span> to
                <span x-text="Math.min(currentPage * 15, filteredData.length)"></span> of
                <span x-text="filteredData.length"></span> vouchers
            </div>
            <div class="flex gap-2">
                <button
                    @click="currentPage--"
                    :disabled="currentPage === 1"
                    class="px-3 py-1 border border-gray-300 rounded-lg text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50"
                >
                    Previous
                </button>
                <button
                    @click="currentPage++"
                    :disabled="currentPage === totalPages"
                    class="px-3 py-1 border border-gray-300 rounded-lg text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50"
                >
                    Next
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function voucherListTable() {
    return {
        // Sample data
        vouchers: [
            { id: 1, date: '2026-04-28', type: 'Payment', number: 'PAY-001', party: 'ABC Suppliers', amount: 15000, narration: 'Payment for raw materials' },
            { id: 2, date: '2026-04-29', type: 'Receipt', number: 'RCV-001', party: 'XYZ Customer', amount: 25000, narration: 'Received payment for invoice INV-123' },
            { id: 3, date: '2026-04-30', type: 'Journal', number: 'JV-001', party: 'N/A', amount: 5000, narration: 'Depreciation adjustment for April' },
            { id: 4, date: '2026-04-27', type: 'Sales', number: 'SAL-045', party: 'Retail Customer', amount: 32000, narration: 'Sale of finished goods' },
            { id: 5, date: '2026-04-26', type: 'Purchase', number: 'PUR-089', party: 'ABC Suppliers', amount: 18000, narration: 'Purchase of inventory items' },
            { id: 6, date: '2026-04-25', type: 'Contra', number: 'CNT-003', party: 'N/A', amount: 10000, narration: 'Cash deposited to bank' },
            { id: 7, date: '2026-04-24', type: 'Credit Note', number: 'CN-012', party: 'XYZ Customer', amount: 2000, narration: 'Sales return - damaged goods' },
            { id: 8, date: '2026-04-23', type: 'Debit Note', number: 'DN-008', party: 'ABC Suppliers', amount: 1500, narration: 'Purchase return' },
        ],

        searchQuery: '',
        sortColumn: 'date',
        sortDirection: 'desc',
        activeFilters: { type: '', party: '' },
        dateRange: { from: '', to: '' },
        selectedVouchers: [],
        currentPage: 1,

        get uniqueParties() {
            return [...new Set(this.vouchers.map(v => v.party).filter(p => p !== 'N/A'))];
        },

        get filteredData() {
            let data = this.vouchers;

            // Search
            if (this.searchQuery) {
                const query = this.searchQuery.toLowerCase();
                data = data.filter(v =>
                    v.number.toLowerCase().includes(query) ||
                    v.party.toLowerCase().includes(query) ||
                    v.narration.toLowerCase().includes(query)
                );
            }

            // Date range
            if (this.dateRange.from) {
                data = data.filter(v => v.date >= this.dateRange.from);
            }
            if (this.dateRange.to) {
                data = data.filter(v => v.date <= this.dateRange.to);
            }

            // Filters
            if (this.activeFilters.type) {
                data = data.filter(v => v.type === this.activeFilters.type);
            }
            if (this.activeFilters.party) {
                data = data.filter(v => v.party === this.activeFilters.party);
            }

            // Sort
            if (this.sortColumn) {
                data = [...data].sort((a, b) => {
                    const aVal = a[this.sortColumn];
                    const bVal = b[this.sortColumn];
                    const comparison = typeof aVal === 'number'
                        ? aVal - bVal
                        : String(aVal).localeCompare(String(bVal));
                    return this.sortDirection === 'asc' ? comparison : -comparison;
                });
            }

            return data;
        },

        get paginatedData() {
            const start = (this.currentPage - 1) * 15;
            return this.filteredData.slice(start, start + 15);
        },

        get totalPages() {
            return Math.ceil(this.filteredData.length / 15);
        },

        handleSearch() {
            this.currentPage = 1;
        },

        applyFilters() {
            this.currentPage = 1;
        },

        sortBy(column) {
            if (this.sortColumn === column) {
                this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                this.sortColumn = column;
                this.sortDirection = 'asc';
            }
        },

        toggleSelectAll(event) {
            this.selectedVouchers = event.target.checked
                ? this.filteredData.map(v => v.id)
                : [];
        },

        toggleSelection(id) {
            const index = this.selectedVouchers.indexOf(id);
            if (index > -1) {
                this.selectedVouchers.splice(index, 1);
            } else {
                this.selectedVouchers.push(id);
            }
        },

        formatDate(date) {
            return new Date(date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        },

        formatCurrency(value) {
            return '₹' + value.toLocaleString('en-IN', { minimumFractionDigits: 2 });
        },

        getTypeColor(type) {
            const colors = {
                'Payment': 'bg-red-100 text-red-800',
                'Receipt': 'bg-green-100 text-green-800',
                'Journal': 'bg-purple-100 text-purple-800',
                'Contra': 'bg-blue-100 text-blue-800',
                'Sales': 'bg-emerald-100 text-emerald-800',
                'Purchase': 'bg-orange-100 text-orange-800',
                'Credit Note': 'bg-pink-100 text-pink-800',
                'Debit Note': 'bg-yellow-100 text-yellow-800'
            };
            return colors[type] || 'bg-gray-100 text-gray-800';
        },

        viewVoucher(voucher) {
            alert('View/Edit Voucher: ' + voucher.number);
            // Implement view/edit modal
        },

        createVoucher() {
            alert('Create New Voucher');
            // Switch to voucher creation view
        },

        batchDelete() {
            if (confirm(`Delete ${this.selectedVouchers.length} vouchers?`)) {
                this.vouchers = this.vouchers.filter(v => !this.selectedVouchers.includes(v.id));
                this.selectedVouchers = [];
            }
        },

        focusNextRow(event, index) {
            event.preventDefault();
            const rows = event.target.closest('tbody').querySelectorAll('tr');
            if (rows[index + 1]) rows[index + 1].focus();
        },

        focusPrevRow(event, index) {
            event.preventDefault();
            const rows = event.target.closest('tbody').querySelectorAll('tr');
            if (rows[index - 1]) rows[index - 1].focus();
        },

        exportToExcel() {
            const headers = 'Date,Type,Number,Party,Amount,Narration';
            const rows = this.filteredData.map(v =>
                `"${v.date}","${v.type}","${v.number}","${v.party}",${v.amount},"${v.narration}"`
            ).join('\n');
            const csv = headers + '\n' + rows;
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vouchers.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    };
}
</script>
