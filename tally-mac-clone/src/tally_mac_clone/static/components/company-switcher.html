<!-- Company Switcher Modal (F3) -->
<div x-show="showCompanySwitcher" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="showCompanySwitcher = false" @keydown.escape.window="showCompanySwitcher = false">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[80vh] flex flex-col">
        <div class="px-6 py-4 border-b flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">Select Company (F3)</h2>
                <p class="text-sm text-gray-600 mt-1">Choose or manage your companies</p>
            </div>
            <button @click="showCompanySwitcher = false" class="text-gray-500 hover:text-gray-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="space-y-3">
                <template x-for="company in companies" :key="company.id">
                    <div class="border rounded-lg p-4 hover:bg-blue-50 hover:border-blue-300 cursor-pointer transition-all"
                         :class="activeCompany?.id === company.id ? 'bg-blue-50 border-blue-300' : ''"
                         @click="switchCompany(company.id)">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-semibold text-gray-900 text-lg" x-text="company.name"></h3>
                                    <span x-show="activeCompany?.id === company.id" class="px-2 py-0.5 bg-blue-600 text-white text-xs rounded-full">Active</span>
                                </div>
                                <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                                    <p class="text-gray-600">
                                        <span class="font-medium">FY:</span>
                                        <span x-text="company.financial_year_start"></span>
                                    </p>
                                    <p class="text-gray-600" x-show="company.gstin">
                                        <span class="font-medium">GSTIN:</span>
                                        <span x-text="company.gstin"></span>
                                    </p>
                                    <p class="text-gray-600" x-show="company.pan">
                                        <span class="font-medium">PAN:</span>
                                        <span x-text="company.pan"></span>
                                    </p>
                                    <p class="text-gray-600" x-show="company.state">
                                        <span class="font-medium">State:</span>
                                        <span x-text="company.state"></span>
                                    </p>
                                </div>
                            </div>
                            <div class="flex gap-2 ml-4">
                                <button @click.stop="editCompany(company.id)"
                                        class="px-3 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-100 transition-colors flex items-center gap-1"
                                        title="Edit company (Alt+E)">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                    Edit
                                </button>
                                <button @click.stop="confirmDeleteCompany(company)"
                                        class="px-3 py-1.5 text-sm border border-red-300 text-red-600 rounded hover:bg-red-50 transition-colors flex items-center gap-1"
                                        title="Delete company (Alt+D)">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <div x-show="companies.length === 0" class="text-center py-12 text-gray-500">
                    <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                    <p class="font-medium">No companies found</p>
                    <p class="text-sm mt-1">Create your first company to get started</p>
                </div>
            </div>
        </div>

        <div class="px-6 py-4 border-t bg-gray-50">
            <button @click="createNewCompany()"
                    class="w-full px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Create New Company
            </button>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div x-show="showDeleteConfirm" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60]" @click.self="showDeleteConfirm = false">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="flex items-start gap-4">
            <div class="flex-shrink-0 w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <div class="flex-1">
                <h3 class="text-lg font-semibold text-gray-900">Delete Company?</h3>
                <p class="mt-2 text-sm text-gray-600">
                    Are you sure you want to delete <strong x-text="companyToDelete?.name"></strong>?
                    This will permanently delete all associated data including vouchers, ledgers, and reports.
                </p>
                <p class="mt-2 text-sm font-medium text-red-600">This action cannot be undone.</p>
            </div>
        </div>

        <div class="mt-6 flex gap-3 justify-end">
            <button @click="showDeleteConfirm = false"
                    class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                Cancel
            </button>
            <button @click="deleteCompany()"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                Delete Company
            </button>
        </div>
    </div>
</div>
