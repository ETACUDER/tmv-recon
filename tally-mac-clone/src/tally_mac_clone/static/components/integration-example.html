<!--
Step 5: Implement modals/forms for create/edit actions
When user clicks "Create Ledger" or clicks a row, show a modal:
-->
<script>
function ledgerTable() {
    return {
        showModal: false,
        selectedLedger: null,

        editLedger(ledger) {
            this.selectedLedger = ledger;
            this.showModal = true;
        },

        createLedger() {
            this.selectedLedger = null;
            this.showModal = true;
        },

        async saveLedger(formData) {
            const method = this.selectedLedger ? 'PUT' : 'POST';
            const url = this.selectedLedger
                ? `/api/ledgers/${this.selectedLedger.id}`
                : '/api/ledgers';

            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                // Refresh data
                await this.init();
                this.showModal = false;
            }
        }
    };
}
</script>

<!--
Modal template example (add to component):
-->
<div x-show="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

        <h3 class="text-lg font-semibold mb-4" x-text="selectedLedger ? 'Edit Ledger' : 'Create Ledger'"></h3>

        <form @submit.prevent="saveLedger(Object.fromEntries(new FormData($event.target)))">
            <!-- Form fields here -->
            <input type="text" name="name" :value="selectedLedger?.name" placeholder="Ledger Name" class="w-full mb-4 px-4 py-2 border rounded-lg" required>

            <div class="flex gap-2 justify-end">
                <button type="button" @click="showModal = false" class="px-4 py-2 border rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Save</button>
            </div>
        </form>
    </div>
</div>
