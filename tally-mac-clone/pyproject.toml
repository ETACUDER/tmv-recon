[project]
name = "recordx-finance"
version = "0.1.0"
description = "RecordX.Finance - AI-powered accounting with conversational interface"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "anthropic",
    "openai>=1.0.0",
    "pydantic",
    "python-dotenv",
    "pandas",
    "openpyxl",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
