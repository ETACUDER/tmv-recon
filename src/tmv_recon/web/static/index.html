<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMV Reconciliation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  .sidebar {
    width: 260px;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid #ddd;
    background: #fafafa;
  }
  .main-content {
    flex: 1;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: white;
  }
  .section-header {
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: #666;
    background: #f5f5f5;
    border-top: 1px solid #e5e5e5;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-header:hover { background: #efefef; }
  .section-content { background: white; }
  .file-item {
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .file-item:hover { background: #f5f5f5; }
  .file-item.active {
    background: #e3f2fd;
    border-left-color: #2196f3;
  }
  .file-name {
    font-weight: 500;
    color: #333;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta {
    font-size: 10px;
    color: #999;
    margin-left: 8px;
  }
  .table-container {
    flex: 1;
    overflow: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    font-family: 'SF Mono', Monaco, Consolas, monospace;
    table-layout: fixed;
  }
  th {
    background: #f8f9fa;
    font-weight: 600;
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #dee2e6;
    border-right: 1px solid #e9ecef;
    position: sticky;
    top: 0;
    font-size: 11px;
    color: #495057;
    z-index: 10;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td {
    padding: 4px 8px;
    border-bottom: 1px solid #f1f3f5;
    border-right: 1px solid #f8f9fa;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-all;
  }
  tr:hover { background: #f8f9fa; }
  .header {
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 16px;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h2 {
    font-size: 14px;
    font-weight: 600;
    color: #222;
  }
  .header-info {
    font-size: 11px;
    color: #666;
    margin-top: 2px;
  }
  .btn {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-primary {
    background: #2196f3;
    color: white;
  }
  .btn-primary:hover { background: #1976d2; }
  .btn-secondary {
    background: white;
    border: 1px solid #ddd;
    color: #666;
  }
  .btn-secondary:hover { background: #f5f5f5; }
  .chevron {
    transition: transform 0.2s;
    font-size: 10px;
  }
  .chevron.open { transform: rotate(90deg); }
</style>
</head>
<body>

<div x-data="app()" x-init="init()" class="flex h-screen">

  <!-- Sidebar -->
  <div class="sidebar">
    <div style="padding: 12px; background: white; border-bottom: 1px solid #ddd;">
      <div style="font-size: 14px; font-weight: 600; color: #222;">TMV Reconciliation</div>
      <div style="font-size: 10px; color: #999; margin-top: 2px;">The Mangal View · FY 25-26</div>
    </div>

    <!-- Input Files Section -->
    <div>
      <div class="section-header" @click="sections.input = !sections.input">
        <span>📥 Input Files</span>
        <span class="chevron" :class="sections.input ? 'open' : ''">▶</span>
      </div>
      <div x-show="sections.input" class="section-content">
        <template x-for="f in files.input.booking" :key="f.path">
          <div @click="loadFile(f.path)"
               :class="selectedFile === f.path ? 'active' : ''"
               class="file-item">
            <span class="file-name" x-text="f.name" :title="f.name"></span>
            <span class="file-meta" x-text="f.size_human"></span>
          </div>
        </template>
        <template x-for="f in files.input.payment" :key="f.path">
          <div @click="loadFile(f.path)"
               :class="selectedFile === f.path ? 'active' : ''"
               class="file-item">
            <span class="file-name" x-text="f.name" :title="f.name"></span>
            <span class="file-meta" x-text="f.size_human"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Canonical Files Section -->
    <div>
      <div class="section-header" @click="sections.canonical = !sections.canonical">
        <span>⚙️ Canonical CSVs</span>
        <span class="chevron" :class="sections.canonical ? 'open' : ''">▶</span>
      </div>
      <div x-show="sections.canonical" class="section-content">
        <template x-for="f in files.canonical" :key="f.path">
          <div @click="loadFile(f.path)"
               :class="selectedFile === f.path ? 'active' : ''"
               class="file-item">
            <span class="file-name" x-text="f.name" :title="f.name"></span>
            <span class="file-meta" x-text="(f.rows || 0).toLocaleString() + ' rows'"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Match Files Section -->
    <div>
      <div class="section-header" @click="sections.matches = !sections.matches">
        <span>🔗 Match Results</span>
        <span class="chevron" :class="sections.matches ? 'open' : ''">▶</span>
      </div>
      <div x-show="sections.matches" class="section-content">
        <template x-for="f in files.matches" :key="f.path">
          <div @click="loadFile(f.path)"
               :class="selectedFile === f.path ? 'active' : ''"
               class="file-item">
            <span class="file-name" x-text="f.name" :title="f.name"></span>
            <span class="file-meta" x-text="(f.rows || 0).toLocaleString()"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Output Files Section -->
    <div>
      <div class="section-header" @click="sections.output = !sections.output">
        <span>📤 Output XMLs</span>
        <span class="chevron" :class="sections.output ? 'open' : ''">▶</span>
      </div>
      <div x-show="sections.output" class="section-content">
        <template x-for="f in files.output.xml" :key="f.path">
          <div class="file-item">
            <span class="file-name" x-text="f.name" :title="f.name"></span>
            <a :href="'/api/download?path=' + encodeURIComponent(f.path)"
               style="font-size: 10px; color: #2196f3; text-decoration: none; margin-left: 8px;">
              ↓
            </a>
          </div>
        </template>
      </div>
    </div>

  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <div>
        <h2 x-text="currentFile || 'Select a file'"></h2>
        <div class="header-info" x-show="previewData.preview">
          <span x-text="(previewData.preview?.rows?.length || 0).toLocaleString()"></span> /
          <span x-text="(previewData.preview?.total_rows || 0).toLocaleString()"></span> rows
          <span x-show="previewData.sheet"> · Sheet: <span x-text="previewData.sheet"></span></span>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button @click="refresh()" class="btn btn-secondary">Refresh</button>
        <a href="/pipeline" class="btn btn-primary" style="text-decoration: none;">Pipeline</a>
      </div>
    </div>

    <div class="table-container">
      <div x-show="!selectedFile" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999;">
        <div style="text-align: center;">
          <div style="font-size: 48px; margin-bottom: 16px;">📄</div>
          <div style="font-size: 14px; font-weight: 500;">Select a file from the sidebar</div>
        </div>
      </div>

      <div x-show="loading" style="display: flex; align-items: center; justify-content: center; height: 100%;">
        <div style="text-align: center; color: #999;">
          <div style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #2196f3; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <div style="font-size: 12px;">Loading...</div>
        </div>
      </div>

      <table x-show="selectedFile && !loading && previewData.preview">
        <thead>
          <tr>
            <template x-for="col in previewData.preview?.columns || []" :key="col">
              <th x-text="col"></th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template x-for="(row, idx) in previewData.preview?.rows || []" :key="idx">
            <tr>
              <template x-for="(cell, cellIdx) in row" :key="cellIdx">
                <td x-text="cell ?? ''"></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<script>
function app() {
  return {
    files: {
      input: { booking: [], payment: [], bank: [], invoice: [] },
      canonical: [],
      matches: [],
      output: { xml: [], csv: [] }
    },
    sections: {
      input: true,
      canonical: true,
      matches: false,
      output: false
    },
    selectedFile: null,
    currentFile: null,
    previewData: {},
    loading: false,

    async init() {
      await this.loadFiles();
    },

    async loadFiles() {
      try {
        const res = await fetch('/api/files');
        this.files = await res.json();
      } catch (e) {
        console.error('Failed to load files:', e);
      }
    },

    async loadFile(path) {
      this.selectedFile = path;
      this.currentFile = path.split('/').pop();
      this.loading = true;
      this.previewData = {};

      try {
        const res = await fetch(`/api/file?path=${encodeURIComponent(path)}&limit=100`);
        this.previewData = await res.json();
      } catch (e) {
        console.error('Preview failed:', e);
        alert('Failed to load file: ' + e.message);
      } finally {
        this.loading = false;
      }
    },

    async refresh() {
      await this.loadFiles();
      if (this.selectedFile) {
        await this.loadFile(this.selectedFile);
      }
    }
  }
}
</script>

</body>
</html>
