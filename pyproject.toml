[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmv-recon"
version = "0.0.1"
description = "PDF/Excel ingest + LLM extraction + Tally-compatible export"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "anthropic>=0.97",
    "python-dotenv>=1.0",
    "pypdf>=6.0",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
tmv-recon-import = "tmv_recon.integration.cli:main"
tmv-recon-ui = "tmv_recon.web.app:main"
tmv-recon-pull = "tmv_recon.tally.cli_pull:main"
tmv-recon-test = "tmv_recon.integration.cli_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
